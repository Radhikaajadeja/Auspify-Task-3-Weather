
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Forecast App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="weather-app">
        <h1>Weather Forecast</h1>
        <p class="subtitle">Check the weather in your city</p>

        <form id="weather-form">
            <input
                type="text"
                id="city-input"
                placeholder="Enter city name"
                aria-label="City name"
                required
            >
            <button type="submit">Search</button>
        </form>

        <p id="status" role="status">Enter a city to check its weather.</p>

        <div id="weather-result" class="weather-result" hidden>
            <h2 id="city-name"></h2>
            <p id="weather-icon" class="weather-icon"></p>
            <p id="temperature" class="temperature"></p>
            <p id="description"></p>

            <div class="weather-details">
                <div class="detail-card">
                    <span>Humidity</span>
                    <strong id="humidity">--</strong>
                </div>

                <div class="detail-card">
                    <span>Wind Speed</span>
                    <strong id="wind-speed">--</strong>
                </div>
                
<div class="forecast-section">
    <h3>5-Day Forecast</h3>
    <div id="forecast-list" class="forecast-list"></div>
</div>

            </div>
        </div>

        <footer>Weather Forecast App | Built with HTML, CSS & JavaScript</footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
